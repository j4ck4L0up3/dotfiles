"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](#bd93f9)\
$directory\
[ ](fg:#bd93f9 bg:#ff79c6)\
$git_branch\
$git_status\
[ ](fg:#ff79c6 bg:#50fa7b)\
$time\
[ ](fg:#50fa7b)\
$nodejs\
$rust\
$golang\
$python\
$php\
\n$character"""


# Use the color palette
palette = "dracula"

# Define Dracula color palette
[palettes.dracula]
background = "#282a36"
current_line = "#44475a"
foreground = "#f8f8f2"
comment = "#6272a4"
cyan = "#8be9fd"
green = "#50fa7b"
orange = "#ffb86c"
pink = "#ff79c6"
purple = "#bd93f9"
red = "#ff5555"
yellow = "#f1fa8c"

[directory]
style = "fg:foreground bg:purple bold "
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:pink"
format = '[[ $symbol $branch ](fg:#f8f8f2 bg:#ff79c6)]($style)'

[git_status]
style = "bg:pink"
format = '[[($all_status$ahead_behind )](fg:#f1fa8c bg:#ff79c6)]($style)'

[character]
success_symbol = "[󱞩](fg:cyan bold)"
error_symbol = "[󱞩](fg:red bold)"
vimcmd_symbol = "[󱞥](fg:cyan bold)"
vimcmd_replace_one_symbol = "[󱞥](fg:green bold)"
vimcmd_replace_symbol = "[󱞥](fg:pink bold)"
vimcmd_visual_symbol = "[󱞥](fg:yellow bold)"

[nodejs]
symbol = ""
style = "fg:green bold"
format = '[ $symbol ($version)]($style)'

[rust]
symbol = ""
style = ""
format = '[ $symbol ($version)](fg:#ff5555)'

[golang]
symbol = "󰟓"
style = ""
format = '[ $symbol ($version)](fg:#8be9fd)'

[php]
symbol = ""
style = ""
format = '[ $symbol ($version)](fg:#ffb86c)'

[time]
disabled = false
time_format = "%R"
style = "fg:background bg:green bold"
format = '[   $time]($style)'
